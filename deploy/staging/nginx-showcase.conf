server {
    listen 8080;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Hardening (2026-11-21): hide framework fingerprint, basic browser security headers.
    proxy_hide_header X-Powered-By;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # All matching is CASE-INSENSITIVE (~*): Express and Next.js route paths case-insensitively,
    # so a case-sensitive rule could be bypassed with e.g. /API/v1/admin (fixed 2026-11-21).

    # 1. Explicitly block sensitive API prefixes for ALL methods
    location ~* ^/+api/+(v1/+)?(admin|auth|customer|orders|checkout|payments|webhooks|cart|wishlist|docs\.json|health|roles|public/+pricing)(/|$) {
        default_type application/json;
        return 403 '{"error":"SHOWCASE_FORBIDDEN","message":"Endpoint disabled in read-only owner showcase."}';
    }

    location ~* ^/+api/+(v1/+)?public/+orders(/|$) {
        default_type application/json;
        return 403 '{"error":"SHOWCASE_FORBIDDEN","message":"Order tracking disabled in read-only owner showcase."}';
    }

    # 2. Approved read-only public catalogue & image endpoints (GET/HEAD/OPTIONS only)
    location ~* ^/api/(v1/)?(products(/[A-Za-z0-9_-]+)?|collections(/[A-Za-z0-9_-]+)?|categories|public/products/[A-Za-z0-9_-]+/customization|public/product-images/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+/[A-Za-z0-9_.-]+\.(png|jpg|jpeg|webp)|public/model-assets/[A-Za-z0-9_.-]+)$ {
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
            return 403;
        }
        error_page 403 = @read_only_json;
        proxy_pass http://mrs_api:4000;
    }

    # 3. Default deny for any other /api path, in any letter case
    location ~* ^/+api(/|$) {
        default_type application/json;
        return 403 '{"error":"SHOWCASE_FORBIDDEN","message":"Unapproved API route blocked in read-only owner showcase."}';
    }

    # 4. Storefront Next.js pages & static assets (GET/HEAD/OPTIONS only)
    location / {
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
            return 403;
        }
        error_page 403 = @read_only_json;
        proxy_pass http://mrs_storefront:3000;
    }

    location @read_only_json {
        default_type application/json;
        return 403 '{"error":"SHOWCASE_READ_ONLY","message":"Write methods are disabled in the read-only owner showcase."}';
    }
}
