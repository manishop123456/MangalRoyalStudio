# HTTP -> HTTPS permanent redirect (preserving ACME challenge for Certbot)
server {
    listen 80;
    listen [::]:80;
    server_name mangalroyalstudio.com www.mangalroyalstudio.com;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://mangalroyalstudio.com$request_uri;
    }
}

# HTTPS www -> apex permanent redirect (covered by SAN certificate)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mangalroyalstudio.com;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/mangalroyalstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mangalroyalstudio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://mangalroyalstudio.com$request_uri;
}

# Canonical HTTPS Storefront: https://mangalroyalstudio.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mangalroyalstudio.com;

    server_tokens off;
    client_max_body_size 2m;

    ssl_certificate /etc/letsencrypt/live/mangalroyalstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mangalroyalstudio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_hide_header X-Powered-By;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Expose Admin UI & Admin API behind HTTP Basic Auth (defense-in-depth: API still requires JWT + CSRF)
    location ^~ /admin {
        auth_basic "Mangal Royal Studio Admin";
        auth_basic_user_file /etc/nginx/.htpasswd_mrs_admin;
        proxy_pass http://127.0.0.1:3101;
    }

    location ~* ^/+api/+(v1/+)?admin(/|$) {
        auth_basic "Mangal Royal Studio Admin";
        auth_basic_user_file /etc/nginx/.htpasswd_mrs_admin;
        proxy_pass http://127.0.0.1:4100;
    }

    # Block OpenAPI spec from public internet
    location ~* ^/+api/+(v1/+)?docs\.json(/|$) {
        default_type application/json;
        return 403 '{"error":"FORBIDDEN","message":"Admin API is restricted to private tunnel access."}';
    }

    # Public & customer API routes
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
    }

    # Public Storefront
    location / {
        proxy_pass http://127.0.0.1:3100;
    }
}
